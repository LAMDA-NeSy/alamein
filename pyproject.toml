requires-python = ">=3.11"
dependencies = [
  "pydantic-ai-slim[openai]==1.44.0",
  "PyYAML==6.0.2"
]

[dependency-groups]
dev = ["pytest==8.3.5"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["ai/tests"]
pythonpath = ["."]
