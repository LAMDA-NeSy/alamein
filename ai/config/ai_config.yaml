provider: deepseek

api:
  kind: chat_completions
  url: https://api.deepseek.com/chat/completions
  localProxyUrl: http://127.0.0.1:8787/chat/completions
  model: deepseek-v4-flash
  apiKey: ""
  timeoutSeconds: 30
  maxToolRounds: 4
  temperature: 0.25
  maxTokens: 3600
  repairMaxTokens: 900
  responseFormat:
    type: json_object

transport:
  stepFallbackReserveMs: 0
  pauseOnCircuitOpen: true

performance:
  planning_context: compact
  max_preparation_units: 12
  max_preparation_targets: 12
  max_preparation_reachable_hexes: 60
  fallback_reserve_ms: 0

context:
  reasoning_memory:
    enabled: true
    within_step: full
    cross_step: summary_plus_excerpt
    max_recent_entries: 4
    max_excerpt_tokens: 800
    max_summary_tokens: 1200
    max_stored_entries: 24
    retain_rejected_options: true
    reset_on_phase_change: true
    reset_on_replanning: true
  phaseStrategyMaxTokens: 3000
  maxLegalActions: 180
  maxCandidateActions: 48
  opportunityAware:
    minimumCombatOdds: "2-1"
    rejectNegativeExpectedCombat: true
    allowNegativeExpectedPrimaryObjective: false
    mineRiskPenalty: 45
    enemyZocPenalty: 14
    friendlyCrowdingPenalty: 18
    noProgressPenalty: 16
    supplyImprovementBonus: 24
    primaryObjectiveBonus: 70
  maxRecentLogItems: 24
  maxToolResults: 12
  maxUnitsPerSide: 96
  maxUnitIndexPerSide: 320
  maxMapIntelHexes: 48
  maxFrontlineUnits: 24
  maxNearbyEnemiesPerUnit: 6
  maxNearbyEnemyDetailUnitsPerSide: 48
  maxReachableHexesPerCandidateUnit: 160
  includeFullStateSummary: false
