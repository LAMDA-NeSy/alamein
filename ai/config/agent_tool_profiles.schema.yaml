$schema: https://json-schema.org/draft/2020-12/schema
type: object
additionalProperties:
  type: object
  required:
    - id
    - version
    - tools
    - max_calls_per_step
    - parallel_tool_calls
    - stop_on_accepted
  additionalProperties: false
  properties:
    id:
      type: string
      minLength: 1
    version:
      type: integer
      minimum: 1
    tools:
      type: array
      minItems: 1
      uniqueItems: true
      items:
        enum:
          - view_map
          - check_combat
          - inspect_supply
          - phase_status
          - hold_unit
          - hold_units
          - act
          - inspect
          - evaluate_action
          - submit_action
    max_calls_per_step:
      type: integer
      minimum: 1
      maximum: 32
    parallel_tool_calls:
      const: false
    stop_on_accepted:
      type: boolean
