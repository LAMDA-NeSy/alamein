version: 1
# Public runs are offline by default. Select a real profile explicitly.
default_profile: mock_primary
task_checker_profile: mock_secondary

models:
  deepseek_flash:
    adapter: openai_compatible
    provider: deepseek
    model: deepseek-v4-flash
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY
    limits:
      context: 256000
      output: 6000
    capabilities:
      tool_calling: true
      structured_output: json_object
      parallel_tool_calls: false
      prompt_cache: false
    defaults:
      temperature: 0.25
      thinking: disabled
      timeout_ms: 45000
      retries: 2
      retry_statuses: [429, 502, 503, 504]
      retry_delays_ms: [2000, 5000]
      circuit_breaker_failures: 3
      circuit_breaker_cooldown_ms: 30000

  deepseek_flash_checker:
    adapter: openai_compatible
    provider: deepseek
    model: deepseek-v4-flash
    base_url: https://api.deepseek.com
