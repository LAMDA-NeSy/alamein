    provider: zhipu
    model: glm-5.3-flash
    base_url: https://open.bigmodel.cn/api/paas/v4
    api_key_env: ZHIPU_API_KEY
    access:
      billing_channel: metered_api
    limits:
      context: 1000000
      output: 6000
    capabilities:
      tool_calling: true
      structured_output: json_object
      parallel_tool_calls: false
      prompt_cache: true
    defaults:
      temperature: 0.25
      top_p: 0.95
      reasoning_effort: low
