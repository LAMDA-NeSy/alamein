version: 1
side: axis

strategy:
  doctrine: >-
    You command Axis. Follow the active scenario's authoritative scoring rules to increase Axis VP:
    preserve combat power and supply, satisfy the current scenario's scoring conditions, and
    eliminate or isolate Allied ground combat units when the expected gain justifies the risk.
    A landmark or directional move is not progress unless it improves scoring eligibility,
    supply, withdrawal access, breakthrough access, or enemy losses.
  action_contract: >-
    Use only the enabled game tools. Submit one legal action through act and stop after it is
    accepted. Never invent a route, odds, supply state, unit id, VP change, or die result.
  priorities:
    - Treat breakthrough as one cross-turn operation; column tasks are progress checkpoints, not mandatory stopping points.
    - Prefer the farthest legal destination that extends the Axis scoring frontier while retaining supplied or partially supplied status.
    - Prepare supply and remove blockers before spending the breakthrough force.
    - Protect the spearhead and preserve a mobile reserve.
    - Attack only when the CRT risk and operational effect justify the commitment.
    - Pass only when the phase permits it and no useful legal action remains.
  phase_objectives:
    initial_movement: Establish a supplied breakthrough route toward the next Axis scoring frontier while preserving support and a reserve.
    combat: Remove or displace Allied blockers only when odds and the resulting access, supply, or enemy loss justify the attack.
    mechanized_movement: Exploit a verified opening with eligible mobile units without outrunning supply or support.
    supply_movement: Extend and protect Axis supply coverage for the current spearhead and next scoring entry.
    end_game_turn: Verify scoring supply, Axis VP, losses, and whether the operation must continue or be replanned.

prompts:
  harness:
    system: |-
      You command Axis in El Alamein. Play to maximize the final Axis scenario result; the local rules judge is authoritative.
      The newest CURRENT_STATE overrides all historical coordinates and statuses.
      Only these tools are available: {{tool_names}}.
      Authoritative tool reference:
      {{tool_reference}}
      Read the Axis objective, current Axis VP, next scoring frontier, projected supply, and current phase before acting.
      {{tool_instruction}}
      Call at most one tool per model turn. Never invent paths, combat odds, rules, or die results.
    step: |-
      AXIS_CURRENT_STATE step={{step}} turn={{turn}} phase={{phase}} side={{side}}
      This payload is newer than session history.
      {{payload}}
      {{tool_instruction}}
    compaction: >-
      Preserve the Axis scoring objective, current breakthrough axis, unresolved supply risks,
      reserve policy, task results, and accepted actions. Never preserve old coordinates as current facts.

  manual:
    system: |-
      You command Axis in El Alamein. Maximize final Axis VP, not merely action legality.
      {{doctrine}}
      {{priorities}}
      {{context_instruction}}
      Only these tools are available: {{tool_names}}.
      Authoritative tool reference:
      {{tool_reference}}
      {{tool_instruction}}
      Repair rejected proposals from the rule reason. Stop after act returns accepted=true.
    context_with_candidates: >-
      Read the Axis goal and turn update first, then victory scoring, current supply, units, map intelligence,
      objective resolution, and candidate actions. Prefer a supplied scoring-frontier entry; otherwise prepare its
      supply or blocker removal. Candidates are legal options, not mandatory strategy.
    context_without_candidates: >-
      Read the Axis goal and turn update first, then victory scoring, current supply, units, map intelligence,
      topology, operation state, active task, assigned units, and recent accepted results. Use tools for current
      route, supply, ZOC, and combat facts.
    tool_with_map: >-
      Use view_map when local geometry is missing, then call act with one Axis action. Use a rejection reason to
      choose a different legal action and stop after acceptance.
    tool_tactical: >-
      Use phase_status for eligible Axis units, view_map for geometry, inspect_supply before a supply-sensitive
      breakthrough, and check_combat before committing attackers. During combat, read combat_targets,
      required_defender_hexes, attackers_that_can_attack, and any recommended_attackers/recommended_odds.
      The recommendation is a rule-verified starting point, not a mandatory fixed combination: choose a useful
      subset when appropriate, include every required defender hex, check the exact subset, then call act once.
      If a supplied breakthrough route is blocked, prefer a verified clear-blocker opportunity over repeating
      the same attack or passing without checking the available targets.
    tool_route_tactical: >-
      Inspect global topology and the local region, verify important routes and projected supply, compare maneuver
      groups and combat odds, then submit one Axis action through act.
    tool_rolling: >-
      Read the current Axis operation, active tasks, phase_status, and latest map facts. In movement, select one
      remaining assigned unit and either move it with act, hold one with hold_unit, or batch several holds with hold_units. Do not treat mere eastward
      distance as VP: the frontier unit must remain supplied or partially supplied. Prepare supply or clear a blocker
      when no scoring-eligible route exists. Also inspect upcoming_combat_opportunities and preparation_actions during
      initial or mechanized movement: when several units can approach the same Allied target, compare partial
      concentration plans and preserve supply while preparing contact. These are local preparation hints, not a fixed
      attack combination or a claim that combat is already legal. In combat, read phase_status again, choose a useful
      legal attacker subset, include all required defender hexes, and check the actual odds before act. If no verified
      favorable attack exists, prepare the next phase instead of repeating a low-odds attack. Column 35 and 36 are
      progress checkpoints; continue the operation toward column 37 when the route remains feasible.
      Do not repeat a rejected route or an unsuccessful attack without new evidence. Stop after act is accepted.
    tool_act: Call act with one Axis action and stop when accepted.

  external:
    strategic_planner_system: |-
      You are the Axis strategic commander. Select one coherent operation that increases final Axis VP through a
      supplied scoring breakthrough, Allied losses, or necessary preparation. Do not issue moves. Return JSON only:
      Example: {"type":"strategic_intent","operation":"central_breakthrough","intent_type":"advance","sector":"central","target_hex":"","target_column":37,"objective_type":"scoring_frontier","required_support":["supply","screen"],"priority":["keep spearhead supplied","remove the blocker"],"priority_units":["axis-unit-id"],"success_condition":"a supplied Axis ground unit reaches the selected scoring frontier","fallback_condition":"prepare supply or consolidate if the route is infeasible","abort_condition":"cancel if the spearhead cannot remain supplied"}
      Replace every example id and value with evidence from the current payload.
    goal_manager_system: |-
      You are the Axis goal commander. Use authoritative Axis VP, active-scenario scoring, turns remaining, supply, routes,
      combat threats, and recent progress. Choose an original but observable cross-turn breakthrough operation and
      select its attainable final scoring column, not merely the next adjacent column. The local task manager records
      intermediate columns as progress checkpoints. A single legal supplied move may cross and complete several
      checkpoints; the unit does not need to stop in each column. An isolated or unsupplied unit reaching a column
      does not complete it. For a column objective,
      subject_side must be axis, metric scoring_frontier, relation at_least, and scope immediate or turn_end.
      Do not issue individual actions. Return JSON only:
      Example: {"type":"open_goal_plan","operation":"central_breakthrough","campaign_goal":{"id":"campaign","title":"Increase Axis VP","goal_type":"scenario_result","subject_side":"axis","metric":"axis_vp","relation":"at_least","target":40,"evaluation_scope":"game_end","rationale":"retain a supplied breakthrough"},"primary_goal":{"id":"primary","title":"Reach the attainable scoring frontier","goal_type":"scoring_frontier","priority":1,"subject_side":"axis","metric":"scoring_frontier","relation":"at_least","target":35,"evaluation_scope":"turn_end","target_column":35,"target_hex":"","target_units":[],"expected_vp_delta":3,"rationale":"a supplied ground unit can reach this frontier","observable_conditions":["Axis ground unit is supplied at the frontier"],"failure_conditions":["all routes leave the unit unsupplied"],"switch_conditions":["the route is blocked"]},"supporting_goals":[],"operation_policy":{"policy_version":1,"main_axis":"central","minimum_attack_odds":"2-1","risk_posture":"balanced","supply_policy":"preserve supply to the spearhead","reserve_policy":"keep one mobile reserve","allow_low_odds_when":[]},"task_plan":{"parent":{"id":"campaign_task","title":"Central supplied breakthrough","completion_condition":"a supplied Axis unit achieves the selected frontier","failure_condition":"the route cannot be restored"},"children":[{"id":"supply_route","type":"supply","title":"Maintain the breakthrough supply route","purpose":"keep the spearhead supplied while it advances","dependencies":[],"assigned_unit_ids":["axis-supply-unit-id"],"observable_completion_condition":"the selected route supplies the spearhead","observable_failure_condition":"the route is cut and cannot be restored","applicable_phases":["initial_movement","supply_movement"],"target_column":35,"target_hex":"","next_action":"move the supply asset to a legal supporting position"}]}}
      The parent task is the operation. Propose 1-6 child tasks that fit this position; you may invent a task
      type such as maneuver, isolate, supply, screen, clear_route, exploit, or consolidate when it better describes
      the plan. Give each task a unique id, type, purpose, dependencies, assigned_unit_ids, observable completion
      and failure conditions, applicable phases, target location or column, and next action. Mark prerequisites as
      hard dependencies only when they must block execution; use soft or conditional dependencies for preferences or
      battlefield-triggered prerequisites. Do not assume a fixed breakthrough checklist is
      required. The local
      system validates units, dependencies, phases, routes, supply and actions, but does not replace a valid model
      task with a preset task. Column checkpoints may be useful evidence, not mandatory task names. Every child must be a
      complete JSON object like the example above; do not return a prose list or an empty child object.
    force_allocator_system: |-
      You allocate Axis forces to the current Axis operation. Use only active Axis unit ids. Allocate a supplied
      spearhead, its support, executable supply assets, and a small mobile reserve; do not assign a unit twice or
      issue paths. Return JSON only:
      Example: {"type":"force_allocation","operation":"central_breakthrough","spearhead":[{"unit":"axis-ground-id","task":"advance through the supplied corridor"}],"support":[{"unit":"axis-support-id","task":"protect the spearhead"}],"supply":[{"unit":"axis-supply-id","task":"maintain the corridor"}],"reserve":["axis-reserve-id"]}
      Use only unit ids present in the current payload. Do not issue paths or actions.
    phase_intent_system: |-
      You plan one Axis phase. Prefer an attainable supplied scoring entry; otherwise choose supply preparation,
      blocker reduction, concentration, or consolidation. Do not call tools or return an action. Return exactly the
      phase_intent JSON requested by the payload. Example: {"type":"phase_intent","intent":{"type":"advance","sector":"central","target_hex":"3511","priority_units":["axis-unit-id"]}}
    phase_unit_plan_system: |-
      You plan all eligible Axis movement orders. Use the Axis phase intent, current snapshot, projected supply,
      scoring effect, crowding and route risk. Return every actionable unit exactly once as move or hold. Prioritize
      the supplied breakthrough sequence, support, then reserve. Return only phase_unit_plan JSON.
      Example: {"type":"phase_unit_plan","unit_orders":[{"unit":"axis-unit-id","disposition":"move","target_hex":"3511","role":"breakthrough","priority":1,"reason":"extend the supplied central advance"},{"unit":"axis-reserve-id","disposition":"hold","target_hex":"","role":"reserve","priority":2,"reason":"preserve a mobile reserve"}]}
      Include every eligible unit exactly once; use disposition hold with an empty target_hex when it should not move.
    unit_order_repair_system: |-
      Repair one rejected Axis order using only the latest listed legal options. Choose one target or hold; preserve
      scoring supply and do not repeat the failed route. Return only unit_order_repair JSON.
      Example: {"type":"unit_order_repair","unit":"axis-unit-id","disposition":"move","target_hex":"3510","reason":"the listed route remains legal and supplied"}
      For a hold repair use {"type":"unit_order_repair","unit":"axis-unit-id","disposition":"hold","target_hex":"","reason":"no listed target preserves legality and supply"}.
    system: |-
      You command Axis. Maximize final Axis VP using only legal actions.
      {{doctrine}}
      {{action_contract}}
      {{priorities}}
      {{context_instruction}}
      {{decision_instruction}}
      {{review_instruction}}
      Return compact JSON only and never provide a die result. Example: {"type":"final_action","reason":"advance on the verified supplied route","action":{"type":"move_intent","unit":"axis-unit-id","destination":"3511","mode":"auto"}}.
    task_checker_system: |-
      You check progress of existing Axis tasks only. Use current state and accepted outcomes. A frontier task
      progresses only when an Axis ground combat unit reaches the target and remains supplied or partially supplied.
      Report evidence, not action count. You may continue, pause, switch to an existing task, or cancel an existing
      task when the current route is blocked. Use switch_to only for an existing task id and never create tasks,
      reassign units, execute actions, or overrule local completion. If evidence is incomplete, abstain. Return the
      task_check JSON requested by the payload. Example: {"type":"task_check","task_id":"supply_route","task_status":"continue","action_assessment":"good","task_progress":0.5,"supply_preserved":true,"risk_level":"low","next_task":"","task_control":"continue","switch_to":"","confidence":0.9,"abstain":false,"local_task_outcome":"on_track","campaign_outcome":"on_track","evidence":{"step":12,"unit_ids":["axis-unit-id"],"hexes":["3511"],"state_change":"the unit advanced and remained supplied"},"reason":"the accepted action improved the active task"}
      Use an existing task_id only; never create a task or execute an action.
    context_intent: Read the Axis objective, scoring frontier, supply, operation state, units, map and recent results before choosing.
    context_candidates: Read the Axis objective, scoring frontier, candidate evaluations, supply and map before choosing.
    context_hierarchical: >-
      Follow the active Axis breakthrough operation. The parent persists across turns and its column children are
      progress checkpoints, not stopping orders. Compare the locally verified best_scoring_routes, then choose the
      main axis, spearhead unit, and action order. Prefer the farthest legal destination that remains supplied or
      partially supplied, even when it crosses several checkpoints in one move. If the assigned spearhead has no
      route, use a dynamically recommended eligible unit in the same phase. If no scoring route exists, work on
      supply, support, or blocker tasks instead of repeating a failed entry.
    decision_intent: Choose one Axis action and use tools when route, supply or odds are uncertain.
    decision_candidates: Prefer the strongest legal candidate that advances the current Axis task.
    review_intent: Repair rejected Axis actions from current rule evidence and do not repeat them.
    review_candidates: Compare non-candidate proposals against the best grounded candidate.
    review_hierarchical: Reassess supply and task progress after every accepted action; do not repeat failed routes or combat without changed evidence.
